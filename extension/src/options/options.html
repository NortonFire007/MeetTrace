<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeetTrace - Bridge Configuration</title>
  <style>
    :root {
      --primary: #7C5CFC;
      --primary-hover: #6B4CE6;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #1E2022;
      --text-muted: #6C757D;
      --border: #E2E4E8;
      --success: #10B981;
      --error: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      width: 380px;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.3;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFF;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #F1F3F5;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #E9ECEF;
    }

    #statusMessage {
      font-size: 12px;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
    }

    #statusMessage.success {
      display: block;
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }

    #statusMessage.error {
      display: block;
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../../icons/icon48.png" alt="MeetTrace">
    <h1>MeetTrace Bridge</h1>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="tokenInput">Bridge Authentication Token</label>
      <input type="password" id="tokenInput" placeholder="Paste token from MeetTrace Settings">
      <div class="hint">Copy this token from MeetTrace Desktop &gt; Settings &gt; Google Meet Bridge.</div>
    </div>

    <div class="form-group">
      <label for="portInput">Localhost Port</label>
      <input type="number" id="portInput" value="38281">
      <div class="hint">Default: 38281 (loopback 127.0.0.1 only).</div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-primary">Save Settings</button>
      <button id="testBtn" class="btn-secondary">Test Connection</button>
    </div>

    <div id="statusMessage"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
