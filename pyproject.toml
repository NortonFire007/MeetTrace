[project]
name = "meettrace"
version = "0.1.0"
description = "Local-first hybrid meeting transcription and notes app for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "MeetTrace" }
]
dependencies = [
  "PySide6>=6.10,<7",
  "pydantic>=2.11,<3",
  "platformdirs>=4.3,<5",
  "httpx>=0.28,<1",
  "pyaudiowpatch>=0.2.12.8",
  "comtypes>=1.4.16",
  "pycaw>=20251023",
  "numpy>=2.5.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meettrace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
